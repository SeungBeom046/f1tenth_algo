# 추월 시나리오 시뮬 전용 값. 판단 파라미터는 config/exp_common.yaml(AurParams)을 그대로 읽는다.
# 태그 규칙은 docs/TUNING.md와 같다:  # TUNE: <설명> | 단위 | 현재값 근거(임시/측정/기획안)
sim:
  dt: 0.01                  # TUNE: 시뮬 고정 스텝 | s | 임시
  max_time: 25.0            # TUNE: 회차 최대 시간 | s | 임시
  end_after_done: 1.0       # TUNE: DONE 또는 FOLLOW 후 정지 뒤 이만큼 더 돌고 끝 | s | 임시
params:                     # AurParams 덮어쓰기 (시뮬 차량 모델에 맞춘 값. 실차 설정 config/exp_common.yaml은 그대로)
  t_d: 0.35                 # TUNE: 유효 제동 지연 = 구동 지연 t_r 0.15 + 1차 지연 tau 0.10 + scan 주기 0.10 | s | 임시 (시뮬 모델에서 계산)
track:
  W: 1.0                    # TUNE: 통로 폭 (추월 차선 벽 거리 = w/2 + c = 0.235 m) | m | 임시 (기획안 조건 0.8/1.0/1.3)
  x_start: -2.0             # TUNE: 통로 뒤 끝 | m | 임시
  x_end: 30.0               # TUNE: 통로 앞 끝 | m | 임시
  wall_height: 0.5          # TUNE: 벽 높이 | m | 임시
start:
  gap0: 1.5                 # TUNE: 출발 시 ego 앞범퍼 → 선행차 뒷면 | m | 기획안 (초기 간격 1.5 m 이상)
  ego_delay: 0.0            # TUNE: ego 출발 지연 (출발 시각 편차) | s | 임시
  leader_delay: 0.0         # TUNE: 선행차 출발 지연 | s | 임시
leader:
  behavior: Y               # TUNE: 선행차 행동 Y(양보) / NY(비양보, 급정지) / YR(양보 후 복귀) | - | 기획안
  d_y: null                 # TUNE: 양보 반응 거리, null이면 seed로 U[d_y_min, d_y_max] | m | 기획안
  return_after: 1.5         # TUNE: (YR) 양보 시작 후 복귀까지 | s | 임시
  yield_yaw_deg: null       # TUNE: 양보 중 차체 yaw 고정값, null이면 선행차 횡 제어기가 정한다 | deg | 임시
  yield_lat_speed: 0.4      # TUNE: (yield_yaw_deg 지정 시) 횡 이동 속도 | m/s | 임시
vehicle:                    # 두 차 공통 (하드웨어 동일)
  length: 0.50              # TUNE: 차 길이 (뒤축→앞 0.41 + 뒤축→뒤 0.09) | m | 측정
  rear_overhang: 0.09       # TUNE: 뒤축 → 뒤 끝 | m | 측정
  height: 0.25              # TUNE: 차체 높이 (라이다 광선에 걸려야 한다) | m | 임시
  wheelbase: 0.33           # TUNE: 휠베이스 | m | 측정
  t_r: 0.15                 # TUNE: 구동 지연 (AurParams.t_d와 같은 가정) | s | 기획안
  tau: 0.10                 # TUNE: 속도 1차 지연 시정수 | s | 임시 (예전 시뮬 가정값)
  a_max: 2.5                # TUNE: 최대 가속 | m/s^2 | 임시 (예전 시뮬 가정값)
  a_b: 3.0                  # TUNE: 최대 감속 (AurParams.a_brake와 같은 가정) | m/s^2 | 기획안
  steer_rate: 6.0           # TUNE: 조향각 변화율 한계 | rad/s | 임시 (예전 시뮬 가정값)
aeb:                        # 실차 autonomous_drive의 AEBSafetyModel(legacy, launch 값과 같은 기본값)을 명령 경로에 넣는다
  enabled: true             # TUNE: AEB 켜기 | - | 측정 (실차 구성)
  speed_source: zero        # TUNE: AEB 속도 입력 zero(현재 실차: /vesc/odom 없음 → 0) / true(4단계 이후 /sensors/core) | - | 측정 (현재 실차 구성)
  hz: 50.0                  # TUNE: autonomous_drive 제어 주기 | Hz | 측정
  path_margin: 0.15         # TUNE: AEB 검사 띠 = 차 중심 ±(0.15 + 이 값). 추월 차선 벽 여유 0.235 m보다 크면 벽에서 AEB가 선다 | m | 측정 (launch 값)
  bumper_emergency_distance: 0.25   # TUNE: AEB 고정 정지 거리 | m | 측정 (launch 값)
lidar:                      # Livox Mid-360을 수평 한 줄로 근사 → pointcloud_to_laserscan과 같은 규칙으로 /scan
  hz: 10.0                  # TUNE: scan 주기 | Hz | 측정
  rays_per_frame: 1440      # TUNE: 광선 수 | 개 | 임시
  pattern: grid
  grid_azimuth: 1440        # TUNE: 방위 개수 | 개 | 임시
  vfov_min_deg: 0.0
  vfov_max_deg: 0.0
  range_min: 0.1
  range_max: 40.0
  range_noise_std: 0.0      # TUNE: 거리 노이즈 | m | 임시 (0 = 무잡음 기준선)
  mount_xyz: [0.13, 0.0, 0.12]   # 뒤축 → 라이다 (0.13 m 측정), 높이는 임시
scan:                       # launch/lidar_drive.launch.py의 pointcloud_to_laserscan과 같은 값
  angle_min: -3.14159
  angle_max: 3.14159
  angle_increment: 0.00436
  min_height: -0.1
  max_height: 0.5
  range_min: 0.05
  range_max: 20.0
  use_inf: true
