# 추월 시나리오 시뮬 전용 값. 판단 파라미터는 config/exp_common.yaml(AurParams)을 그대로 읽는다.
# 태그 규칙은 docs/TUNING.md와 같다:  # TUNE: <설명> | 단위 | 현재값 근거(임시/측정/기획안)
sim:
  dt: 0.01                  # TUNE: 시뮬 고정 스텝 | s | 임시
  max_time: 25.0            # TUNE: 회차 최대 시간 | s | 임시
  end_after_done: 1.0       # TUNE: DONE 또는 FOLLOW 후 정지 뒤 이만큼 더 돌고 끝 | s | 임시
params:                     # AurParams 덮어쓰기 (시뮬 차량 모델에 맞춘 값. 실차 설정 config/exp_common.yaml은 그대로)
  t_d: 0.25                 # TUNE: 시뮬 차량의 명령 → 감속 지연 = 구동 지연 t_r 0.15 + 1차 지연 tau 0.10 (scan 주기 Δ는 scan_period로 따로 더해진다) | s | 임시 (시뮬 모델에서 계산)
track:
  W: 1.0                    # TUNE: 통로 폭 (추월 차선 벽 거리 = w/2 + c = 0.235 m) | m | 임시 (기획안 조건 0.8/1.0/1.3)
  x_start: -2.0             # TUNE: 통로 뒤 끝 | m | 임시
  x_end: 30.0               # TUNE: 통로 앞 끝 | m | 임시
  wall_height: 0.5          # TUNE: 벽 높이 | m | 임시
  outer_width: null         # null이면 외부 벽 없음. 낮은 가드레일 바깥 복도 재현 시 2.7 m
  outer_center_y: 0.0       # 외부 복도 중앙의 y [m], 가드레일 중앙은 0
start:
  gap0: 1.5                 # TUNE: 출발 시 ego 앞범퍼 → 선행차 뒷면 | m | 기획안 (초기 간격 1.5 m 이상)
  ego_delay: 0.0            # TUNE: ego 출발 지연 (출발 시각 편차) | s | 임시
  leader_delay: 0.0         # TUNE: 선행차 출발 지연 | s | 임시
leader:
  behavior: Y               # TUNE: 선행차 행동 Y(양보) / NY(비양보, 급정지 후 계속 정지) / NYR(급정지 후 resume_after 뒤 재출발, 레이스 S2) / YR(양보 후 복귀) / S(처음부터 정지, 레이스 S3) | - | 기획안 + 레이스 개정안
  d_y: null                 # TUNE: 양보 반응 거리, null이면 seed로 U[d_y_min, d_y_max] | m | 기획안
  resume_after: 2.0         # TUNE: (NYR) 급정지 후 다시 출발까지 | s | 레이스 개정안 (2026-11-19)
  stop_y: null              # TUNE: (S) 멈춘 차 횡위치, null이면 오른쪽 차선 중심 −δ | m | 레이스 개정안
  return_after: 1.5         # TUNE: (YR) 양보 시작 후 복귀까지. 후행차가 이미 옆에 온 뒤 복귀하는 경우는 실차 선행차가 하지 않는 시뮬 전용 시나리오 | s | 임시
  fix_W: true               # TUNE: 선행차에 실측 W(= track.W)를 준다 (W_leader). 끄면 scan 추정 | - | 임시 (2026-11-15 승인)
  yield_yaw_deg: null       # TUNE: 양보 중 차체 yaw 고정값, null이면 선행차 횡 제어기가 정한다 | deg | 임시
  yield_lat_speed: 0.4      # TUNE: (yield_yaw_deg 지정 시) 횡 이동 속도 | m/s | 임시
vehicle:                    # 두 차 공통 (하드웨어 동일)
  length: 0.50              # TUNE: 차 길이 (뒤축→앞 0.41 + 뒤축→뒤 0.09) | m | 측정
  rear_overhang: 0.09       # TUNE: 뒤축 → 뒤 끝 | m | 측정
  height: 0.25              # TUNE: 차체 높이 (라이다 광선에 걸려야 한다) | m | 임시
  wheelbase: 0.33           # TUNE: 휠베이스 | m | 측정
  t_r: 0.15                 # TUNE: 구동 지연 (AurParams.t_d와 같은 가정) | s | 기획안
  tau: 0.10                 # TUNE: 속도 1차 지연 시정수 | s | 임시 (예전 시뮬 가정값)
  a_max: 2.5                # TUNE: 최대 가속 | m/s^2 | 임시 (예전 시뮬 가정값)
  a_b: 3.0                  # TUNE: 최대 감속 (AurParams.a_brake와 같은 가정) | m/s^2 | 기획안
  steer_rate: 6.0           # TUNE: 조향각 변화율 한계 | rad/s | 임시 (예전 시뮬 가정값)
  steer_offset: 0.0         # TUNE: 서보 중심 오차 (명령 0 rad일 때 실제 조향, 왼쪽 +) — 실차 트림 오차 모사 | rad | 임시 (0 = 이상적 차량)
aeb:                        # 실차 autonomous_drive의 AEBSafetyModel을 두 차의 명령 경로에 넣는다
  enabled: true             # TUNE: AEB 켜기 | - | 측정 (실차 구성)
  model: geometric          # TUNE: legacy(기존 주행) / geometric(추월 실험 1층: 좁은 띠 + 속도 TTC, tracker 무관) | - | 임시 (2026-11-15 결정)
  speed_source: measured    # TUNE: AEB 속도 입력 measured(4단계 /sensors/core) / unknown(속도 없음 → geometric은 고정 거리) / zero(legacy에 0) | - | 임시
  curved_band: true         # TUNE: geometric AEB 검사 띠를 조향 명령 원호를 따라 휜다 (false = 직선 띠) | - | 임시 (2026-11-15 B1)
  curve_max_steering: 0.3   # TUNE: 휜 띠에 쓰는 조향 상한, 0이면 상한 없음 (launch aeb_curve_max_steering과 같게) | rad | 임시 (2026-11-17 실차: 조향 0.78에서 옆 벽에 섬)
  band_intersect: true      # TUNE: 휜 띠와 직선 띠 둘 다에 든 점만 AEB (옆에 나란한 벽 무시) (launch aeb_band_intersect와 같게) | - | 임시 (2026-11-17 실차)
  ttc_threshold: 0.35       # TUNE: TTC 임계 (한계 = 속도 × 이 값). d* = 0.425 m(v 0.9)보다 작아야 정상 추종에서 안 걸린다: < 0.47 | s | 임시
  hz: 50.0                  # TUNE: autonomous_drive 제어 주기 | Hz | 측정
  vehicle_half_width: 0.135 # TUNE: AEB 검사 띠 반폭 = 실측 차 반폭 (launch aeb_vehicle_half_width와 같게) | m | 측정 (2026-11-17, 이전 0.15)
  path_margin: 0.0          # TUNE: AEB 검사 띠 = 차 중심 ±(반폭 + 이 값) = ±0.135. 실차는 추월 때 차체-벽 약 5 cm (launch 값과 같게) | m | 임시 (2026-11-17, 이전 0.01)
  latch_release_sec: 1.0    # TUNE: 실험 AEB 고정을 정지 후 비상 아님이 이 시간 이어지면 해제, 0이면 AUTO off까지 (launch aeb_latch_release_sec와 같게) | s | 임시 (실차 2026-11-18)
  partial_wide_memory: 10   # TUNE: 실험 AEB, 최근 n scan 안에 같은 거리에서 넓은 뒷면을 봤으면 좁게 보여도 부분 관측 규칙 안 씀, 0이면 끔 (launch aeb_partial_wide_memory와 같게) | scan | 임시 (실차 overtake_02 AEB 77%)
  bumper_overlap_tolerance: 0.0     # TUNE: 앞범퍼 뒤 이 거리까지의 점도 AEB 후보 (launch aeb_bumper_overlap_tolerance와 같게) | m | 임시 (실차 test_02: 자기 차 앞부분 점으로 closest 0 AEB)
  bumper_emergency_distance: 0.20   # TUNE: AEB 고정 정지 거리, 정지 여유 m 0.15 이상 (launch 값과 같게) | m | 임시 (2026-11-17, 이전 0.25)
imu:                        # 자차 IMU 자이로 (pose_filter 입력). Mid-360 내장 IMU 가정
  gyro_noise_std: 0.01      # TUNE: scan 주기(0.1 s) 평균 yaw rate 잡음 | rad/s | 임시 (사양 미확인)
  gyro_bias: 0.005          # TUNE: 고정 바이어스 (선행차는 부호 반대) | rad/s | 임시 (0.3°/s)
lidar:                      # Livox Mid-360을 수평 한 줄로 근사 → pointcloud_to_laserscan과 같은 규칙으로 /scan
  hz: 10.0                  # TUNE: scan 주기 | Hz | 측정
  rays_per_frame: 11520     # TUNE: 광선 수 = 방위 1440 × 고도 8줄 | 개 | 임시
  pattern: grid
  grid_azimuth: 1440        # TUNE: 방위 개수 | 개 | 임시
  vfov_min_deg: -7.0        # Mid-360 수직 시야 −7° ~ 52° 중 아래쪽만 2° 간격 8줄 (−7 ~ +7°). 숙인 라이다에서도 수평 띠가 남게
  vfov_max_deg: 7.0
  range_min: 0.1
  range_max: 40.0
  range_noise_std: 0.0      # TUNE: 거리 노이즈 | m | 임시 (0 = 무잡음 기준선)
  mount_xyz: [0.13, -0.005, 0.24]   # 뒤축 → 라이다 (실측 2026-11-03: 앞 0.13, 오른쪽 0.5 cm, 바닥에서 장착면 0.21 + 원점 0.03(임시))
  mount_rpy: [0.0023, 0.0557, 0.0]  # 라이다 장착 기울기 roll, pitch, yaw [rad] (실측 2026-11-06 정지 IMU, pitch 3.2° 앞 숙임)
  leader_visible_half_width: null   # TUNE: ego 라이다가 앞차 차체에서 맞히는 폭의 절반 (검은 차체는 가운데 비검정 부품만 반사), null = 차체 전부 | m | 임시 (실차 test_01: 2.1 m에서 폭 0.02~0.11 m → 0.05)
camera:                     # D455 깊이 카메라 (ego만, my_algo/camera_fusion.py와 같은 계산)
  enabled: false            # TUNE: 카메라 융합 시뮬 | - | 임시
  mount_xyz: [0.40, 0.0, 0.16]      # TUNE: 뒤축 → 카메라 (앞바퀴 축 0.33 + 7 cm, 바닥에서 0.16 m) | m | 측정 (2026-11-21 실측)
  pitch_deg: 17.5           # TUNE: 숙임 (실차 15~20°) | deg | 측정 (2026-11-21 대략)
  width: 160                # 실차 640×480 stride 4와 같은 화소 수
  height: 120
  hfov_deg: 87.0            # D455 깊이 시야 87° × 58° (사양)
  vfov_deg: 58.0
  max_depth: 6.0
  depth_noise: 0.005        # TUNE: 깊이 잡음 σ = 이 값 × z² (D455 사양 2 m에서 2% 이하) | 1/m | 임시
  leader_dropout: 0.2       # TUNE: 검은 앞차 화소의 깊이 실패 확률 | - | 임시 (미측정)
  min_height: 0.05          # camera_fusion 노드 값과 같게
  max_height: 0.5
  range_min: 0.3
  range_max: 3.0
  min_points: 3
  yolo: true                # 시뮬 YOLO: 앞차 꼭짓점 투영 상자를 확률로 낸다
  yolo_p_detect: 0.8        # TUNE: 프레임당 검출 확률 | - | 임시 (COCO 모델로 1/10 차 검출률 미측정)
  yolo_max_range: 4.0       # TUNE: 이 거리 넘으면 검출 안 함 | m | 임시
scan:                       # launch/lidar_drive.launch.py의 pointcloud_to_laserscan과 같은 값
  angle_min: -3.14159
  angle_max: 3.14159
  angle_increment: 0.00436
  level: true               # TUNE: 라이다 기울기를 되돌린 수평 프레임에서 scan을 만든다 (launch level_scan과 같게) | - | 임시 (2026-11-17 실측 반영)
  min_height: -0.1
  max_height: 0.5
  range_min: 0.05
  range_max: 20.0
  use_inf: true
