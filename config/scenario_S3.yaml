# [EXP-VAR] 시나리오 S3: 틈 0.15 m (통과 불가), 돌출 없음 (B2 대비 P의 불필요 감속)
# 트랙 좌표: AUTO 시작 시 에고 차체 앞 끝 = 0, 진행 방향 +. 아래 거리 값은 트랙 마킹 후 실측해 교체.
/**:
  ros__parameters:
    scenario: S3
    gap_width: 0.15            # [EXP-VAR] 틈 폭 [m]. 트랙 배치 계산 입력 (track_layout.py)
    trigger_enabled: false
    collision_x: 4.625          # [EXP0-MEASURE] P1–P2 틈 중앙. track_layout.layout()의 계산값 사본 (다르면 실행 시 경고)
    stop_distance: 7.5         # [EXP-FIXED] 소프트웨어 정지선: AUTO 후 주행 거리 > 이 값이면 0 명령 [m]
                               #   = 트랙 끝 방호벽까지 거리 - 여유. 트랙 마킹 후 교체
    accel_end_x: 2.5           # [EXP-FIXED] 가속 구간 끝 (v_ref 도달 판정 위치) [m]
    test_x_start: 2.5          # [EXP-FIXED] 시험 구간 (손실 ΔT 적분 범위) [m]
    test_x_end: 7.0
    row_x_start: 4.0           # [EXP0-MEASURE] 주차열 P1 시작 x [m]. 트랙 배치의 유일 출처 (track_layout.py)
    row_x_end: 5.95             # [EXP0-MEASURE] track_layout 계산값 사본 (row_x_start + n box_len + (n-1) gap)
    box_len: 0.55              # [EXP-FIXED] 주차 박스 진행 방향 길이 [m] (0.55 × 0.30 × 0.35). 트랙 배치 계산용
    n_boxes: 3                 # 주차 박스 개수 (P1–P3). E0은 0
    right_wall: false          # S4: 우측도 연속 벽 (시뮬 월드 생성용)
