# 발행자 점검 규칙 (publisher_guard_node). 형식: "토픽|허용 노드 전체 이름,...|최소|최대"
# 허용 노드 이름은 TBD(세션 1): check_vehicle.sh의 "TF 발행 노드"와 ros2 topic info -v 결과로 확정한다.
#   docs/OPEN_ITEMS.md 1절 "발행자 점검 허용 노드". 확정 전에는 mode: warn 으로 돌려 실제 이름을 확인할 것.
# 토픽 이름도 TBD(세션 1). bringup의 cloud_topic/imu_topic 인자와 같은 이름이어야 한다.
publisher_guard_node:
  ros__parameters:
    mode: enforce            # [EXP-FIXED] enforce = 위반 시 회차 거부 | warn = 경고만
    settle_sec: 3.0
    rules:
      - "/livox/lidar|/livox_lidar_publisher|1|1"                # TBD(세션 1) Livox 드라이버 노드 이름
      - "/livox/imu|/livox_lidar_publisher|1|1"                  # TBD(세션 1)
      - "/commands/motor/speed|/exp_drive_mux,/joy_controller|1|2"
      - "/tf_static|/tf_base_to_livox,/tf_livox_to_imu,/camera/camera|2|3"  # TBD(세션 1) realsense 노드 이름
      # odom→base_link TF 발행자는 정확히 하나 (vesc_to_odom 또는 EKF). 둘이면 TF가 튄다
      - "/tf|/vesc_to_odom_node,/ekf_odom|1|1"                   # TBD(세션 1) 기존 vesc_to_odom 노드 이름
      - "/vesc/odom|/vesc_to_odom_node|1|1"                      # TBD(세션 1) odom 토픽·노드 이름
